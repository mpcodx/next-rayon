version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rayonwebsolutions
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Interview drive bookings/resumes live here; the volume below keeps
      # them across container rebuilds.
      - INTERVIEW_DRIVE_DATA_DIR=/app/data
      # Add other environment variables as needed
    env_file:
      - .env
    volumes:
      # Candidate bookings + uploaded resumes. Back this up.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
